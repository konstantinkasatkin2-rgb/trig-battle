name: Build APK (pygame)

# Собирает APK из ready_apk/ в облаке GitHub.
# После успешной сборки APK появится во вкладке Actions -> Artifacts.
# Запуск: push в ветку или кнопка "Run workflow".

on:
  push:
    paths:
      - 'ready_apk/**'
      - '.github/workflows/build-apk-pygame.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf \
            libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev cmake ccache

      # --- Кэш разделён намеренно ---
      # SDK/NDK (~2 ГБ) — ключ стабильный, переживает любые изменения.
      - name: Cache Android SDK / NDK
        id: cache-sdk
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildozer
          key: buildozer-sdk-${{ runner.os }}-v1
          restore-keys: |
            buildozer-sdk-${{ runner.os }}-

      # Дерево сборки: ключ НЕ по всему buildozer.spec, а только по тому, что
      # действительно влияет на компиляцию рецептов. Иначе смена версии или
      # ориентации заставляла бы пересобирать SDL2 и harfbuzz заново (~9 мин)
      # вместо переиспользования готовых объектов (~1 мин).
      #
      # Ключ по-прежнему БЕЗ restore-keys: иначе p4a увидит распакованные
      # исходники прошлой версии и напишет "pygame is already unpacked,
      # skipping", то есть соберёт СТАРЫЙ код вопреки смене рецепта.
      - name: Compute build signature
        id: sig
        working-directory: ready_apk
        run: |
          # Всё, что меняет набор или параметры сборки рецептов. Комментарии
          # и форматирование сюда не входят намеренно.
          grep -E '^(requirements|p4a\.(branch|bootstrap|bootstrap_branch|extra_args)|android\.(archs|api|ndk_api|ndk|min_sdk_version|release_artifact))[[:space:]]*=' \
            buildozer.spec | sort > /tmp/build-sig.txt
          echo "строк в подписи: $(wc -l < /tmp/build-sig.txt)"
          cat /tmp/build-sig.txt
          echo "sig=$(sha256sum /tmp/build-sig.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache build tree
        id: cache-build
        uses: actions/cache/restore@v4
        with:
          path: ready_apk/.buildozer
          key: buildozer-build-${{ runner.os }}-${{ steps.sig.outputs.sig }}-${{ hashFiles('ready_apk/p4a-recipes/**') }}

      # Кэш компилятора нужен только когда рецепты действительно
      # пересобираются. На быстром пути (кэш дерева попал) ничего не
      # компилируется, и качать сотни мегабайт ради этого смысла нет.
      # ccache применяется p4a при компиляции (в логах видно /usr/bin/ccache
      # перед вызовом clang), но сам выбирает каталог для кэша, и он не
      # обязательно ~/.ccache: из-за этого первый запуск сохранил пустой
      # кэш ("Path Validation Error: Path ... does not exist"). Поэтому путь
      # задаём явно. CCACHE_BASEDIR нужен, чтобы ключи кэша не зависели от
      # случайно выбранного рабочего каталога.
      - name: Настроить кэш компилятора
        working-directory: ready_apk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ccache"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "ccache: $(ccache --version 2>&1 | head -1 || echo 'не установлен')"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache"

      - name: Cache ccache (only when recipes are rebuilt)
        id: cache-ccache
        if: steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-v1
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer cython
          buildozer --version

      - name: Sanity check (игра импортируется)
        run: |
          python -m pip install --upgrade pygame
          # игра, профили и сеть лежат в корне репозитория, точка входа
          # main.py — в ready_apk; рецепт собирает их вместе
          cd ready_apk && python -c "
          import sys; sys.path.insert(0, '..')
          import main, trig_battle_pygame, profiles, netgame
          print('все модули на месте:', main.__name__, trig_battle_pygame.__name__, profiles.__name__, netgame.__name__)
          "

      # Рецепт trigbattle_src — единственное, что кладёт код игры в APK.
      # Проверяем его за секунду ДО девятиминутной сборки, чтобы не ждать
      # полного прогона из-за опечатки в рецепте.
      - name: Sanity check (рецепт кладёт игру в APK)
        working-directory: ready_apk
        run: python tools/test_recipe.py

      # Тот же приём для правки рецепта pygame: без simd_blitters_*.c в
      # `surface` APK собирается зелёным, а display не грузится на телефоне.
      - name: "Sanity check (рецепт pygame, simd_blitters в surface)"
        working-directory: ready_apk
        run: python tools/test_pygame_recipe.py

      # Игра по сети целиком проверяется на ПК: два игрока в одном
      # процессе, реальные сокеты. Секунды вместо девяти минут сборки,
      # а ловит ровно те ошибки, которые на телефоне ищутся вручную.
      - name: "Sanity check (игра по сети, два игрока)"
        working-directory: ready_apk
        run: |
          python -m pip install --upgrade pygame
          python tools/test_netgame.py

      # release, а не debug, по двум причинам:
      #   * подпись постоянным ключом из репозитория — новая версия
      #     ставится поверх старой, а Google Play не считает приложение
      #     подозрительным (debug-подпись каждый раз разная);
      #   * APK меньше и быстрее собирается (символы вырезаются).
      - name: Build APK (release)
        working-directory: ready_apk
        run: buildozer android release

      # buildozer называет файл package-version-arch-debug.apk.
      # Собираем из него один файл с понятным именем: <package>_<version>.apk
      - name: Prepare artifact
        id: prepare
        working-directory: ready_apk
        run: |
          set -euo pipefail
          NAME=$(grep -E '^package\.name' buildozer.spec | head -1 | cut -d= -f2 | tr -d ' ')
          VER=$(grep -E '^version' buildozer.spec | head -1 | cut -d= -f2 | tr -d ' ')
          mkdir -p dist
          shopt -s nullglob
          apks=(bin/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then echo "APK не собран!"; exit 1; fi
          cp "${apks[0]}" "dist/${NAME}_${VER}.apk"
          echo "apkname=${NAME}_${VER}" >> "$GITHUB_OUTPUT"
          echo "Итоговый файл: dist/${NAME}_${VER}.apk"
          ls -lh dist

      # Ключ подписи не должен меняться: иначе Android требует сначала
      # удалить старую версию, а Google Play считает приложение
      # подозрительным. Сверяем блок подписи из самого APK — так не нужен
      # apksigner и не зависит от версии SDK.
      - name: Check signing certificate
        working-directory: ready_apk
        run: |
          set -euo pipefail
          APK=$(ls -1 dist/*.apk | head -1)
          echo "APK: $APK"
          SIG=$(unzip -Z1 "$APK" | grep -E '^META-INF/.*\.(RSA|DSA|EC)$' | head -1)
          if [ -z "$SIG" ]; then
            echo "ОШИБКА: в APK нет блока подписи — он не подписан?"
            exit 1
          fi
          echo "блок подписи: $SIG"
          CERT=$(unzip -p "$APK" "$SIG" | sha256sum | cut -d' ' -f1)
          echo "хеш сертификата: $CERT"
          if [ ! -f expected_cert.txt ]; then
            echo "$CERT" > expected_cert.txt
            echo "сохранён в expected_cert.txt; следующие сборки обязаны"
            echo "им подписываться, иначе обновление поверх старой версии"
            echo "перестанет работать"
          elif ! grep -qF "$CERT" expected_cert.txt; then
            echo "ОШИБКА: APK подписан другим ключом, чем предыдущие сборки"
            echo "пользователь не сможет обновиться поверх старой версии"
            exit 1
          else
            echo "подпись совпадает с предыдущими сборками"
          fi

      # Проверка, что игра реально попала внутрь APK: без неё приложение
      # стартует и мгновенно закрывается (именно так вёл себя APK 0.2.0)
      - name: Verify game files inside APK
        working-directory: ready_apk
        run: |
          set -euo pipefail
          python3 tools/verify_apk.py dist/*.apk

      # Проверка линковки .so. Именно так проявился баг pygame под Android:
      # сборка зелёная, а на телефоне падает dlopen из-за символа
      # alphablit_alpha_sse2_argb_surf_alpha. Теперь такой APK не уйдёт
      # дальше по конвейеру.
      - name: Verify ELF symbols inside APK
        working-directory: ready_apk
        run: |
          set -euo pipefail
          python3 tools/verify_elf.py dist/*.apk

      # upload-artifact выполняется и при провале проверки выше: нужен
      # файл, чтобы разобрать бандл и понять, что именно не попало внутрь.
      # Статус прогона при этом остаётся failed — красный.
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.apkname }}
          path: ready_apk/dist/trigbattle_*.apk
          if-no-files-found: error

      # Сохраняем оба кэша даже при падении сборки: иначе каждый неудачный
      # прогон заново качает ~2 ГБ SDK/NDK.
      - name: Save Android SDK / NDK cache
        uses: actions/cache/save@v4
        if: always() && steps.cache-sdk.outputs.cache-primary-key != ''
        with:
          path: ~/.buildozer
          key: ${{ steps.cache-sdk.outputs.cache-primary-key }}

      - name: Save build tree cache
        uses: actions/cache/save@v4
        if: always() && steps.cache-build.outputs.cache-primary-key != ''
        with:
          path: ready_apk/.buildozer
          key: ${{ steps.cache-build.outputs.cache-primary-key }}

      # ccache сохраняем только если им пользовались (см. условие restore):
      # на быстром пути его нет, незачем забивать кэш лишними сотнями МБ.
      - name: Save ccache
        uses: actions/cache/save@v4
        if: always() && steps.cache-ccache.outputs.cache-primary-key != ''
        with:
          path: .ccache
          key: ${{ steps.cache-ccache.outputs.cache-primary-key }}