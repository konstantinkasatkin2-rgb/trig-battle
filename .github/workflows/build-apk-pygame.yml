name: Build APK (pygame)

# Собирает APK из ready_apk/ в облаке GitHub.
# После успешной сборки APK появится во вкладке Actions -> Artifacts.
# Запуск: push в ветку или кнопка "Run workflow".

on:
  push:
    paths:
      - 'ready_apk/**'
      - '.github/workflows/build-apk-pygame.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf \
            libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev cmake ccache

      - name: Cache buildozer / SDK / NDK
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ready_apk/.buildozer
            ~/.buildozer
          # Ключ НЕ зависит от buildozer.spec: иначе смена версии или
          # requirements заставила бы заново качать SDK/NDK (~2 ГБ).
          key: buildozer-pygame-${{ runner.os }}-p4a2024
          restore-keys: |
            buildozer-pygame-${{ runner.os }}-

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer cython
          buildozer --version

      - name: Sanity check (игра импортируется)
        run: |
          python -m pip install --upgrade pygame
          cd ready_apk && python -c "import main; print('entry point ok')"

      - name: Build APK
        working-directory: ready_apk
        run: buildozer android debug

      # buildozer называет файл package-version-arch-debug.apk.
      # Собираем из него один файл с понятным именем: <package>_<version>.apk
      - name: Prepare artifact (trigbattle_0.2.0.apk)
        working-directory: ready_apk
        run: |
          set -euo pipefail
          NAME=$(grep -E '^package\.name' buildozer.spec | head -1 | cut -d= -f2 | tr -d ' ')
          VER=$(grep -E '^version' buildozer.spec | head -1 | cut -d= -f2 | tr -d ' ')
          mkdir -p dist
          shopt -s nullglob
          apks=(bin/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then echo "APK не собран!"; exit 1; fi
          cp "${apks[0]}" "dist/${NAME}_${VER}.apk"
          echo "Итоговый файл: dist/${NAME}_${VER}.apk"
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trigbattle_0.2.0
          path: ready_apk/dist/trigbattle_*.apk
          if-no-files-found: error

      # Сохраняем SDK/NDK даже при падении сборки: иначе каждый неудачный
      # прогон заново качает ~2 ГБ. Сохраняем ровно под тем же ключом,
      # который восстановили (если кэша не было — пустой ключ, пропускаем).
      - name: Save buildozer / SDK / NDK cache
        uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-primary-key != ''
        with:
          path: |
            ready_apk/.buildozer
            ~/.buildozer
          key: ${{ steps.cache.outputs.cache-primary-key }}