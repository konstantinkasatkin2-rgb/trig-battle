name: Test APK on emulator (ищем причину падения)

# Собранный APK молча вылетал на телефоне: пустой экран, никаких сообщений.
# Причина была видна только в logcat. Этот воркфлоу запускает APK на
# эмуляторе Android и печатает журналы прямо в лог прогона:
#   - жив ли процесс после запуска;
#   - скриншот экрана;
#   - наш собственный журнал trigbattle.log;
#   - logcat (в т.ч. crash buffer и FATAL/AndroidRuntime).
#
# Эмулятор требует x86_64, а боевой APK собирается под arm64-v8a (armv7
# ломает сборку), поэтому здесь отдельная сборка под x86_64.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-emulator.yml'
      - '.github/scripts/run_on_emulator.sh'

jobs:
  build-x86:
    name: Build APK for x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf \
            libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev \
            libffi-dev libssl-dev cmake ccache

      # тот же ключ, что и в build-apk-pygame.yml — общий кэш SDK/NDK,
      # заново 2 ГБ не качаем
      - name: Cache Android SDK / NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-sdk-${{ runner.os }}-v1
          restore-keys: |
            buildozer-sdk-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: ready_apk/.buildozer
          key: buildozer-x86-${{ runner.os }}-${{ hashFiles('ready_apk/buildozer.spec', 'ready_apk/p4a-recipes/**') }}

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer cython

      - name: Sanity checks (рецепты)
        working-directory: ready_apk
        run: |
          python tools/test_recipe.py
          python tools/test_pygame_recipe.py

      - name: Switch spec to x86_64
        working-directory: ready_apk
        run: |
          # armv7-сборка pygame не компилируется, поэтому боевой APK
          # только arm64-v8a; эмулятору нужен x86_64
          sed -i 's/^android\.archs = .*/android.archs = x86_64/' buildozer.spec
          grep -n '^android.archs' buildozer.spec

      - name: Build APK (x86_64)
        working-directory: ready_apk
        run: buildozer android debug

      - name: Collect APK
        run: |
          mkdir -p apk
          cp ready_apk/bin/*.apk apk/
          ls -lh apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64
          path: apk/*.apk
          if-no-files-found: error

  run-emulator:
    name: Launch on emulator and collect logs
    needs: build-x86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-x86_64
          path: apk

      - name: Run APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          heigh: 1920
          disable-animations: true
          disable-snapshot: true
          script: bash .github/scripts/run_on_emulator.sh

      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics
          path: out/
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "### Процесс" && (cat out/pid.txt 2>/dev/null || echo "нет данных")
          echo "### Журнал игры" && (cat out/trigbattle.log 2>/dev/null || echo "пусто")
          echo "### Скриншот" && ls -l out/screen.png 2>/dev/null || true
